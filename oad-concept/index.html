<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IAU Office of Astronomy for Development</title>
  <meta name="description" content="The OAD uses astronomy as a tool for sustainable development around the world.">

  <!-- Font: Outfit from Google Fonts (we'll add Space Grotesk when we build the impact numbers) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- HEADER: sits on top of the hero, transparent background -->
  <header class="site-header">
    <a href="/" class="logo">
      <img src="assets/images/oad-symbol.png" alt="IAU Office of Astronomy for Development home" width="56" height="56">
    </a>

    <nav aria-label="Main">
      <ul class="nav-links">
        <li><a href="#work">Our work</a></li>
        <li><a href="#impact">Impact</a></li>
        <li><a href="#regions">Regions</a></li>
        <li><a href="#about">About us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- HERO: the first screen -->
    <section class="hero">

      <!-- Background video. It starts empty on purpose: js/main.js only adds
           the video files on screens where it makes sense (see that file).
           Everyone else sees the poster image. -->
      <video
        class="hero-video"
        muted
        loop
        playsinline
        preload="none"
        poster="assets/video/milky-way-poster.jpg"
        data-src="assets/video/milky-way.mp4"
        aria-hidden="true">
      </video>

      <!-- Dark gradient between the video and the text, so the text stays readable -->
      <div class="hero-overlay"></div>

      <div class="hero-content">
        <h1>Astronomy for a better world</h1>
        <p class="hero-text">
          We use astronomy, its people, skills and infrastructure,
          as a tool for sustainable development in communities around the globe.
        </p>
        <div class="hero-actions">
          <a href="#work" class="button button-primary">Explore our work</a>
          <a href="#apply" class="button button-secondary">Apply for funding</a>
        </div>
      </div>

      <!-- Pause button for the video (hidden until the video actually plays) -->
      <button class="video-toggle" type="button" aria-label="Pause background video" hidden>
        <svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/>
          <rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/>
        </svg>
        <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"/>
        </svg>
      </button>
    </section>
  </main>

  <!-- JavaScript goes last, so the page content loads first -->
  <script src="js/main.js" defer></script>
</body>
</html>
